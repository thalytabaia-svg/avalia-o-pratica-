<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo das Motos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mundo das Motos</h1>
        <button id="theme-toggle">Modo Escuro</button>
    </header>

    <main>
        <section class="card">
            <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=600" alt="Moto Esportiva">
            <h2>Super Esportiva 1000cc</h2>
            <p>Uma máquina projetada para alta performance, velocidade e precisão nas pistas e estradas.</p>
            
            <div id="extra-info" class="hidden">
                <p><strong>Detalhes Técnicos:</strong> Potência de 200 cv, freios ABS com controle de tração, painel digital TFT e aceleração de 0 a 100 km/h em menos de 3 segundos.</p>
            </div>

            <div class="actions">
                <button id="btn-read-more" onclick="toggleInfo()">Ver Mais</button>
                <button onclick="knowMore()">Saiba Mais</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
